# Build de Windows. Só roda quando alguém pedir (Actions > build > Run workflow); não roda em PR nem em push.
# Por padrão gera só o artifact; marque "publicar" para atualizar o release "latest".
name: build

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar o zip no release "latest" (substitui o anterior)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Instalar Godot e export template de Windows
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz templates/windows_release_x86_64.exe templates/version.txt -d "$tpl"
          rm godot.zip templates.tpz

      - name: Importar projeto
        run: ./godot --headless --path . --import

      - name: Testes
        run: |
          for t in tests/test_*.gd; do
            ./godot --headless --path . -s "$t"
          done

      - name: Exportar Windows
        run: |
          mkdir -p build/windows
          ./godot --headless --path . --export-release "Windows Desktop" build/windows/PactoCarmesim.exe
          test -f build/windows/PactoCarmesim.exe
          name="PactoCarmesim-${GITHUB_REF_NAME//\//-}-windows"
          (cd build/windows && zip -q "../../$name.zip" PactoCarmesim.exe)
          echo "ZIP=$name.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows
          path: ${{ env.ZIP }}
          retention-days: 7

      - name: Atualizar o release "latest" (substitui o anterior)
        if: inputs.publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "$ZIP" --target "$GITHUB_SHA" --prerelease --title "Build mais recente" \
            --notes "Build manual do commit $GITHUB_SHA. Cada nova publicação substitui este release."
