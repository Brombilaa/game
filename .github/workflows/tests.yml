name: Testes

on:
  pull_request:
  push:
    branches: [main]

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: 4.3-stable
    steps:
      - uses: actions/checkout@v4

      - name: Baixar a Godot
        run: |
          cd "$RUNNER_TEMP"
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$RUNNER_TEMP/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      # Gera o cache de class_name (.godot/) que os testes usam.
      - name: Importar o projeto
        run: timeout 600 "$GODOT" --headless --path . --import || true

      - name: Rodar os testes
        run: |
          set -o pipefail
          status=0
          for t in tests/test_*.gd; do
            echo "== $t"
            if ! timeout 60 "$GODOT" --headless --path . -s "$t" 2>&1 | tee out.log; then
              status=1
            elif grep -qE "SCRIPT ERROR|Parse Error" out.log; then
              status=1
            fi
          done
          exit $status

  # M2: abre as cenas principais numa janela virtual (xvfb) e guarda as capturas como artefato da PR.
  # Não bloqueia a PR (continue-on-error) enquanto o ambiente gráfico do CI não provar ser estável.
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    env:
      GODOT_VERSION: 4.3-stable
    steps:
      - uses: actions/checkout@v4

      - name: Instalar xvfb e bibliotecas gráficas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1 libglu1-mesa libxi6 libxcursor1 libxrandr2 libxinerama1 libasound2t64 || sudo apt-get install -y -qq xvfb libgl1 libxi6 libxcursor1 libxrandr2 libxinerama1

      - name: Baixar a Godot
        run: |
          cd "$RUNNER_TEMP"
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$RUNNER_TEMP/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Importar o projeto
        run: timeout 600 "$GODOT" --headless --path . --import || true

      - name: Capturar as cenas
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" timeout 120 "$GODOT" --path . --rendering-driver opengl3 --resolution 1920x1080 -s tools/capture_scenes.gd -- capturas 2>&1 | tee captura.log
          # Erro de script ao desenhar (HUD, minimapa, barra de ações) falha o passo.
          if grep -E "SCRIPT ERROR|Parse Error" captura.log; then exit 1; fi

      - name: Guardar as capturas
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: capturas
          path: capturas/*.png
          if-no-files-found: warn
          retention-days: 1
